<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无畏契约 - 召唤李冠廷</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a; overflow: hidden;
  display: flex; justify-content: center; align-items: center;
  height: 100vh;
  font-family: 'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;
  user-select: none; -webkit-user-select: none;
}
canvas { display: block; }
#video-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.92); z-index: 100;
  justify-content: center; align-items: center; flex-direction: column;
}
#video-overlay video {
  max-width: 90%; max-height: 75%; border: 3px solid #ff4655;
  box-shadow: 0 0 40px rgba(255,70,85,0.5); border-radius: 8px;
}
#video-overlay .close-btn {
  margin-top: 20px; padding: 12px 36px; background: #ff4655; color: #fff;
  border: none; border-radius: 6px; font-size: 18px; cursor: pointer;
  font-family: 'Microsoft YaHei','PingFang SC',sans-serif;
}
#video-overlay .reward-text {
  color: #ffd700; font-size: 22px; margin-bottom: 15px;
  font-weight: bold; text-shadow: 0 0 20px rgba(255,215,0,0.6);
}
#hint {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  color: #ff4655; font-size: 14px; pointer-events: none; opacity: 0.8;
  text-align: center; font-family: 'Microsoft YaHei','PingFang SC',sans-serif;
  z-index: 10;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<div id="video-overlay">
  <div class="reward-text">🎁 奖励时间！这是你应得的 🎁</div>
  <video id="reward-video" controls autoplay playsinline>
    <source src="reward.mp4" type="video/mp4">
  </video>
  <button class="close-btn" onclick="closeVideo()">关闭继续 →</button>
</div>
<script>
// ==================== 无畏契约 · 召唤李冠廷 ====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hintEl = document.getElementById('hint');
const videoOverlay = document.getElementById('video-overlay');
const rewardVideo = document.getElementById('reward-video');
const W = 800, H = 800;
canvas.width = W; canvas.height = H;

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
}
resize(); window.addEventListener('resize', resize);

function lx(x) { return (x + 2) / 4 * W; }
function ly(y) { return (2 - y) / 4 * H; }
function ls(s) { return s / 4 * W; }

// ==================== 全局状态 ====================
let scene = 0; // 0=军械库, 1=战术简报, 2=最终抉择, 3=集结完成
let frame = 0;
let sceneTransition = 0;
let particles = [];
let tracers = [];
let explosions = [];
let agents = [];
let sceneStartFrame = 0;
let btnNoX = 0.5, btnNoY = -0.85;
const btnYesX = -0.45, btnYesY = -0.85;
let videoShown = false;
let pulseRings = [];

// 无畏契约配色
const VAL_RED = '#ff4655';
const VAL_DARK = '#0f1923';
const VAL_GOLD = '#ffd700';
const VAL_WHITE = '#ece8e1';
const VAL_BLUE = '#00bcd4';

// ==================== 背景星星 ====================
const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * 4 - 2, y: Math.random() * 4 - 2,
    size: Math.random() * 2 + 0.3,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.04 + 0.01
  });
}

// ==================== 特效函数 ====================
function spawnTracer(x1, y1, x2, y2, color) {
  tracers.push({
    x1, y1, x2, y2,
    life: 1, decay: 0.06,
    color
  });
}

function spawnExplosion(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 0.08 + 0.02;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1, decay: Math.random() * 0.025 + 0.012,
      color, size: Math.random() * 8 + 3
    });
  }
  // 脉冲环
  pulseRings.push({ x, y, r: 0.05, alpha: 1, color });
}

// ==================== 无畏契约 Logo 风格绘制 ====================
function drawValorantStyleText(text, cx, cy, size, alpha) {
  ctx.textAlign = 'center';
  // 红色描边效果
  ctx.fillStyle = `rgba(255,70,85,${alpha * 0.3})`;
  ctx.font = `bold ${ls(size)}px "Microsoft YaHei","PingFang SC",sans-serif`;
  for (let ox = -2; ox <= 2; ox += 4) {
    for (let oy = -2; oy <= 2; oy += 4) {
      ctx.fillText(text, lx(cx) + ox, ly(cy) + oy);
    }
  }
  // 主体
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  ctx.fillText(text, lx(cx), ly(cy));
}

// 绘制无畏契约风格的六边形图标
function drawHexagon(cx, cy, r, color, alpha) {
  const sx = lx(cx), sy = ly(cy), sr = ls(r);
  ctx.fillStyle = color.replace(')', `, ${alpha})`).replace('rgb(', 'rgba(');
  if (color.startsWith('#')) {
    ctx.fillStyle = hexToRgba(color, alpha);
  }
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = i * Math.PI / 3 - Math.PI / 6;
    const px = sx + Math.cos(angle) * sr;
    const py = sy + Math.sin(angle) * sr;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = hexToRgba(color, Math.min(1, alpha + 0.2));
  ctx.lineWidth = ls(0.012);
  ctx.stroke();
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function drawTracerLine(x1, y1, x2, y2, color, alpha) {
  const sx1 = lx(x1), sy1 = ly(y1), sx2 = lx(x2), sy2 = ly(y2);
  const grd = ctx.createLinearGradient(sx1, sy1, sx2, sy2);
  grd.addColorStop(0, hexToRgba(color, alpha));
  grd.addColorStop(1, hexToRgba(color, 0));
  ctx.strokeStyle = grd;
  ctx.lineWidth = ls(0.015);
  ctx.beginPath();
  ctx.moveTo(sx1, sy1);
  ctx.lineTo(sx2, sy2);
  ctx.stroke();
}

// ==================== 按钮绘制 ====================
function drawValButton(x, y, w, h, text, color, alpha, glowIntensity) {
  const bx = lx(x), by = ly(y), bw = ls(w), bh = ls(h);

  // 外发光
  if (glowIntensity > 0) {
    ctx.shadowColor = color;
    ctx.shadowBlur = ls(0.06) * glowIntensity;
  }

  // 主体
  ctx.fillStyle = hexToRgba(color, alpha);
  ctx.beginPath();
  const br = ls(0.03);
  roundRect(bx - bw/2, by - bh/2, bw, bh, br);
  ctx.fill();

  // 边框
  ctx.strokeStyle = hexToRgba(color, Math.min(1, alpha + 0.3));
  ctx.lineWidth = ls(0.012);
  roundRect(bx - bw/2, by - bh/2, bw, bh, br);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 顶部高光
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  roundRect(bx - bw/2 + ls(0.02), by + bh/2 - ls(0.03), bw - ls(0.04), bh*0.35, ls(0.015));
  ctx.fill();

  // 文字
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${ls(0.1)}px "Microsoft YaHei","PingFang SC",sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(text, bx, by + ls(0.035));

  return { x: bx, y: by, w: bw, h: bh };
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// ==================== 场景切换 ====================
function nextScene() {
  scene++;
  sceneTransition = 0;
  sceneStartFrame = frame;
  if (scene === 3) spawnExplosion(0, 0.1, VAL_GOLD, 50);
}

// ==================== 鼠标交互 ====================
let mouseX = -999, mouseY = -999;

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sX = W / rect.width, sY = H / rect.height;
  mouseX = ((e.clientX - rect.left) * sX) / W * 4 - 2;
  mouseY = 2 - ((e.clientY - rect.top) * sY) / H * 4;

  if (scene === 2 && !videoShown) {
    if (Math.abs(mouseX - btnNoX) < 0.3 && Math.abs(mouseY - btnNoY) < 0.15) {
      for (let i = 0; i < 50; i++) {
        const nx = Math.random() * 1.6 - 0.8;
        const ny = Math.random() * 0.7 - 1.2;
        if (Math.abs(nx - btnYesX) > 0.45 || Math.abs(ny - btnYesY) > 0.2) {
          btnNoX = nx; btnNoY = ny; break;
        }
      }
    }
  }
});

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sX = W / rect.width, sY = H / rect.height;
  const cx = ((e.clientX - rect.left) * sX) / W * 4 - 2;
  const cy = 2 - ((e.clientY - rect.top) * sY) / H * 4;

  // 点击特效
  spawnExplosion(cx, cy, VAL_RED, 8);

  if (scene === 0 && frame - sceneStartFrame > 30) {
    spawnExplosion(0, 0.15, VAL_RED, 20);
    nextScene();
  } else if (scene === 1 && frame - sceneStartFrame > 30) {
    spawnExplosion(0, 0.15, VAL_RED, 20);
    nextScene();
  } else if (scene === 2 && !videoShown) {
    // 检测 "同意开战"
    if (Math.abs(cx - btnYesX) < 0.3 && Math.abs(cy - btnYesY) < 0.16) {
      spawnExplosion(btnYesX, btnYesY, VAL_GOLD, 40);
      setTimeout(() => {
        videoOverlay.style.display = 'flex';
        rewardVideo.play().catch(() => {});
        videoShown = true;
        nextScene();
      }, 400);
    }
    // 检测 "再想想"
    if (Math.abs(cx - btnNoX) < 0.3 && Math.abs(cy - btnNoY) < 0.16) {
      spawnExplosion(btnNoX, btnNoY, '#555', 15);
      btnNoX = Math.random() * 1.6 - 0.8;
      btnNoY = Math.random() * 0.7 - 1.2;
    }
  } else if (scene === 3) {
    spawnExplosion(cx, cy, VAL_GOLD, 15);
  }
});

// 触摸支持
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sX = W / rect.width, sY = H / rect.height;
  mouseX = ((e.touches[0].clientX - rect.left) * sX) / W * 4 - 2;
  mouseY = 2 - ((e.touches[0].clientY - rect.top) * sY) / H * 4;
  if (scene === 2 && !videoShown) {
    if (Math.abs(mouseX - btnNoX) < 0.32 && Math.abs(mouseY - btnNoY) < 0.17) {
      for (let i = 0; i < 50; i++) {
        const nx = Math.random() * 1.6 - 0.8;
        const ny = Math.random() * 0.7 - 1.2;
        if (Math.abs(nx - btnYesX) > 0.45 || Math.abs(ny - btnYesY) > 0.2) {
          btnNoX = nx; btnNoY = ny; break;
        }
      }
    }
  }
}, {passive: false});

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sX = W / rect.width, sY = H / rect.height;
  const cx = ((e.changedTouches[0].clientX - rect.left) * sX) / W * 4 - 2;
  const cy = 2 - ((e.changedTouches[0].clientY - rect.top) * sY) / H * 4;

  spawnExplosion(cx, cy, VAL_RED, 8);

  if (scene === 0 && frame - sceneStartFrame > 30) { spawnExplosion(0, 0.15, VAL_RED, 20); nextScene(); }
  else if (scene === 1 && frame - sceneStartFrame > 30) { spawnExplosion(0, 0.15, VAL_RED, 20); nextScene(); }
  else if (scene === 2 && !videoShown) {
    if (Math.abs(cx - btnYesX) < 0.33 && Math.abs(cy - btnYesY) < 0.18) {
      spawnExplosion(btnYesX, btnYesY, VAL_GOLD, 40);
      setTimeout(() => {
        videoOverlay.style.display = 'flex';
        rewardVideo.play().catch(() => {});
        videoShown = true;
        nextScene();
      }, 400);
    }
    if (Math.abs(cx - btnNoX) < 0.33 && Math.abs(cy - btnNoY) < 0.18) {
      spawnExplosion(btnNoX, btnNoY, '#555', 15);
      btnNoX = Math.random() * 1.6 - 0.8;
      btnNoY = Math.random() * 0.7 - 1.2;
    }
  } else if (scene === 3) {
    spawnExplosion(cx, cy, VAL_GOLD, 15);
  }
});

// ==================== 关闭视频 ====================
function closeVideo() {
  videoOverlay.style.display = 'none';
  rewardVideo.pause();
}
window.closeVideo = closeVideo;

// ==================== 主循环 ====================
function render() {
  frame++;
  if (sceneTransition < 1) sceneTransition = Math.min(1, sceneTransition + 0.035);

  // ---- 无畏契约主题背景 ----
  const bgGrd = ctx.createLinearGradient(0, 0, 0, H);
  bgGrd.addColorStop(0, '#1a1018');
  bgGrd.addColorStop(0.4, '#0f1923');
  bgGrd.addColorStop(1, '#0a0e14');
  ctx.fillStyle = bgGrd;
  ctx.fillRect(0, 0, W, H);

  // 背景几何线
  for (let i = 0; i < 6; i++) {
    const ly2 = ly(-1.3 + i * 0.45);
    ctx.strokeStyle = `rgba(255,70,85,${0.04 + 0.02 * Math.sin(frame * 0.02 + i)})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, ly2);
    ctx.lineTo(W, ly2 + (i % 2 === 0 ? 20 : -20));
    ctx.stroke();
  }

  // 对角线装饰
  ctx.strokeStyle = 'rgba(255,70,85,0.06)';
  ctx.lineWidth = 1;
  for (let i = -2; i <= 3; i++) {
    const off = i * ls(0.6);
    ctx.beginPath();
    ctx.moveTo(W/2 + off, 0); ctx.lineTo(W/2 + off + ls(0.3), H); ctx.stroke();
  }

  // ---- 星星 ----
  for (const s of stars) {
    const twinkle = 0.25 + 0.75 * Math.abs(Math.sin(frame * s.speed + s.phase));
    ctx.fillStyle = `rgba(255,255,255,${0.5*twinkle})`;
    ctx.beginPath();
    ctx.arc(lx(s.x), ly(s.y), Math.max(0.3, ls(0.003) * s.size * twinkle), 0, Math.PI*2);
    ctx.fill();
  }

  // ---- 弹道线 ----
  for (let i = tracers.length - 1; i >= 0; i--) {
    const tr = tracers[i];
    tr.life -= tr.decay;
    if (tr.life <= 0) { tracers.splice(i,1); continue; }
    drawTracerLine(tr.x1, tr.y1, tr.x2, tr.y2, tr.color, tr.life);
  }
  // 随机弹道
  if (frame % 20 === 0 && scene >= 2) {
    const sx = (Math.random() - 0.5) * 3;
    const sy = (Math.random() - 0.5) * 2;
    spawnTracer(sx, sy, sx + (Math.random()-0.5)*1.5, sy + (Math.random()-0.5)*1.5,
                Math.random() < 0.5 ? VAL_RED : '#ffab00');
  }

  // ---- 脉冲环 ----
  for (let i = pulseRings.length - 1; i >= 0; i--) {
    const pr = pulseRings[i];
    pr.r += 0.04; pr.alpha -= 0.04;
    if (pr.alpha <= 0) { pulseRings.splice(i,1); continue; }
    ctx.strokeStyle = hexToRgba(pr.color, pr.alpha * 0.5);
    ctx.lineWidth = ls(0.015);
    ctx.beginPath();
    ctx.arc(lx(pr.x), ly(pr.y), ls(pr.r), 0, Math.PI*2);
    ctx.stroke();
  }

  // ---- 粒子 ----
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy -= 0.0008; p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i,1); continue; }
    ctx.fillStyle = hexToRgba(p.color, p.life);
    ctx.beginPath();
    ctx.arc(lx(p.x), ly(p.y), Math.max(0.3, ls(0.005) * p.size * p.life), 0, Math.PI*2);
    ctx.fill();
  }

  const ta = sceneTransition;

  // ==================== 场景 0: 契约启动 ====================
  if (scene === 0) {
    // 大型六边形 Logo 区域
    const hexPulse = 1 + 0.05 * Math.sin(frame * 0.04);
    drawHexagon(0, 0.45, 0.4 * hexPulse, VAL_RED, 0.25);
    drawHexagon(0, 0.45, 0.28 * hexPulse, VAL_RED, 0.12);
    drawHexagon(0, 0.45, 0.16 * hexPulse, VAL_RED, 0.08);

    // 中央 V 标志
    ctx.fillStyle = hexToRgba(VAL_RED, 0.9);
    ctx.font = `bold ${ls(0.55)}px "Microsoft YaHei","PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('V', lx(0), ly(0.5));

    // 标题
    for (let i = 2; i >= 0; i--) {
      const off = (i-1)*ls(0.005);
      ctx.fillStyle = i === 1
        ? `rgba(255,70,85,0.95)`
        : `rgba(255,120,100,0.3)`;
      ctx.font = `bold ${ls(0.3)}px "Microsoft YaHei","PingFang SC",sans-serif`;
      ctx.fillText('无 畏 契 约', W/2 + off, ly(1.2) + off);
    }

    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = `${ls(0.12)}px "Microsoft YaHei","PingFang SC",sans-serif`;
    ctx.fillText('VALORANT · 战术集结', W/2, ly(0.95));

    // 闪烁提示
    if (frame - sceneStartFrame > 30) {
      const ha = 0.5 + 0.4 * Math.sin(frame * 0.06);
      ctx.fillStyle = `rgba(255,255,255,${ha})`;
      ctx.font = `${ls(0.11)}px "Microsoft YaHei","PingFang SC",sans-serif`;
      ctx.fillText('点击进入军械库 →', W/2, ly(-1.3));
    }
    hintEl.textContent = '🎯 点击屏幕进入';
  }

  // ==================== 场景 1: 战术简报 ====================
  else if (scene === 1) {
    drawHexagon(0, 0.35, 0.25, VAL_RED, 0.15);

    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,70,85,0.9)';
    ctx.font = `bold ${ls(0.24)}px "Microsoft YaHei","PingFang SC",sans-serif`;
    ctx.fillText('📋 战术简报', W/2, ly(1.3));

    // 任务卡片
    const cardX = W/2, cardY = ly(0.2), cardW = ls(1.5), cardH = ls(1.0);
    ctx.fillStyle = 'rgba(15,25,35,0.85)';
    ctx.strokeStyle = hexToRgba(VAL_RED, 0.3);
    ctx.lineWidth = ls(0.01);
    ctx.beginPath();
    roundRect(cardX - cardW/2, cardY - cardH/2, cardW, cardH, ls(0.04));
    ctx.fill();
    ctx.stroke();

    const missionLines = [
      '🎯 任务目标：',
      '   召唤特工 李冠廷',
      '   加入无畏契约战场',
      '',
      '⚔️ 作战区域：',
      '   亚海悬城 / 极寒冰港',
      '',
      '🔥 奖励：',
      '   🎁 神秘奖励视频',
      '',
      '状态：等待特工响应...'
    ];
    ctx.textAlign = 'left';
    for (let i = 0; i < missionLines.length; i++) {
      const la = Math.min(1, (frame - sceneStartFrame - 20 - i * 5) / 25);
      if (la > 0) {
        if (missionLines[i].includes('目标') || missionLines[i].includes('区域') || missionLines[i].includes('奖励')) {
          ctx.fillStyle = `rgba(255,70,85,${la})`;
          ctx.font = `bold ${ls(0.1)}px "Microsoft YaHei","PingFang SC",sans-serif`;
        } else {
          ctx.fillStyle = `rgba(220,220,220,${la})`;
          ctx.font = `${ls(0.095)}px "Microsoft YaHei","PingFang SC",sans-serif`;
        }
        ctx.fillText(missionLines[i], cardX - cardW/2 + ls(0.08), cardY - cardH/2 + ls(0.25) + i * ls(0.12));
      }
    }
    ctx.textAlign = 'center';

    if (frame - sceneStartFrame > 50) {
      const ha = 0.5 + 0.4 * Math.sin(frame * 0.06);
      ctx.fillStyle = `rgba(255,255,255,${ha})`;
      ctx.font = `${ls(0.11)}px "Microsoft YaHei","PingFang SC",sans-serif`;
      ctx.fillText('点击接受任务 →', W/2, ly(-1.3));
    }
    hintEl.textContent = '📋 查看战术简报 · 点击继续';
  }

  // ==================== 场景 2: 最终抉择 ====================
  else if (scene === 2) {
    // 顶部标题
    ctx.textAlign = 'center';
    for (let i = 2; i >= 0; i--) {
      const off = (i-1)*ls(0.005);
      ctx.fillStyle = i === 1 ? 'rgba(255,70,85,0.9)' : 'rgba(255,100,80,0.25)';
      ctx.font = `bold ${ls(0.24)}px "Microsoft YaHei","PingFang SC",sans-serif`;
      ctx.fillText('⚡ 李冠廷，出战吗？ ⚡', W/2 + off, ly(1.2) + off);
    }

    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = `${ls(0.12)}px "Microsoft YaHei","PingFang SC",sans-serif`;
    ctx.fillText('无畏契约 · 排位赛等你', W/2, ly(0.85));

    // 中间装饰 - 枪线交叉
    drawTracerLine(-0.8, -0.1, 0.8, -0.5, VAL_RED, 0.3);
    drawTracerLine(0.7, -0.4, -0.7, -0.6, '#ffab00', 0.25);

    // "同意开战" 按钮
    const glowVal = 0.5 + 0.4 * Math.abs(Math.sin(frame * 0.05));
    drawValButton(btnYesX, btnYesY, 0.55, 0.17, '同意开战 🔥', VAL_RED, 0.6 + glowVal*0.3, glowVal);

    // "再想想" 按钮 (逃跑)
    drawValButton(btnNoX, btnNoY, 0.52, 0.16, '再想想...', '#444444', 0.45, 0);

    // 提示
    ctx.textAlign = 'center';
    const ha = 0.5 + 0.3 * Math.sin(frame * 0.04);
    ctx.fillStyle = `rgba(255,200,150,${ha})`;
    ctx.font = `${ls(0.1)}px "Microsoft YaHei","PingFang SC",sans-serif`;
    ctx.fillText('🎁 同意有惊喜奖励！', W/2, ly(-1.4));

    hintEl.textContent = '🔥 快选同意！奖励等着你！';
  }

  // ==================== 场景 3: 集结完成！ ====================
  else if (scene === 3) {
    // 金色庆祝
    const celebPulse = 0.6 + 0.4 * Math.sin(frame * 0.04);

    // 光芒射线
    for (let i = 0; i < 12; i++) {
      const angle = (i/12)*Math.PI*2 + frame*0.01;
      const r1 = ls(0.3), r2 = ls(1.2 + 0.3*Math.sin(frame*0.03+i));
      ctx.strokeStyle = `rgba(255,215,0,${0.08*celebPulse})`;
      ctx.lineWidth = ls(0.015);
      ctx.beginPath();
      ctx.moveTo(W/2 + Math.cos(angle)*r1, H/2 + Math.sin(angle)*r1);
      ctx.lineTo(W/2 + Math.cos(angle)*r2, H/2 + Math.sin(angle)*r2);
      ctx.stroke();
    }

    ctx.textAlign = 'center';
    const titles = [
      '🎉 特工已就位！ 🎉',
      '李冠廷 加入战场！',
      '无畏契约 · 开战！',
      'MVP 就是你！'
    ];
    const tIdx = Math.min(titles.length-1, Math.floor((frame - sceneStartFrame)/70));
    const title = titles[tIdx];

    for (let i = 3; i >= 0; i--) {
      const off = i === 0 ? 0 : (i%2===0?1:-1)*ls(0.005)*(i+1);
      ctx.fillStyle = i === 0
        ? `rgba(255,215,0,0.95)`
        : `rgba(255,100,50,0.3)`;
      ctx.font = `bold ${ls(0.28)}px "Microsoft YaHei","PingFang SC",sans-serif`;
      if (i === 0) { ctx.shadowColor = 'rgba(255,215,0,0.6)'; ctx.shadowBlur = ls(0.1); }
      else ctx.shadowBlur = 0;
      ctx.fillText(title, W/2 + off, ly(1.15) + off);
    }
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = `${ls(0.13)}px "Microsoft YaHei","PingFang SC",sans-serif`;
    ctx.fillText('🎁 奖励已发放 · 快上号！', W/2, ly(0.8));

    // Agent 图标
    const agents = ['⚡', '🔥', '💨', '🎯'];
    for (let a = 0; a < 4; a++) {
      const ax = -0.6 + a * 0.4;
      const ay = 0 + Math.sin(frame*0.05 + a)*0.08;
      ctx.font = `${ls(0.18)}px "Microsoft YaHei","PingFang SC",sans-serif`;
      ctx.fillText(agents[a], lx(ax), ly(ay));
    }

    // 持续爆炸
    if (frame % 15 === 0) {
      spawnExplosion((Math.random()-0.5)*1.2, (Math.random()-0.5)*0.8, Math.random()<0.5?VAL_GOLD:VAL_RED, 10);
    }

    const ha = 0.5 + 0.3 * Math.sin(frame * 0.04);
    ctx.fillStyle = `rgba(255,255,255,${ha})`;
    ctx.font = `${ls(0.1)}px "Microsoft YaHei","PingFang SC",sans-serif`;
    ctx.fillText('点击继续庆祝！🔥', W/2, ly(-1.4));

    if (videoShown) {
      hintEl.textContent = '🎁 点击关闭视频后可继续庆祝';
    } else {
      hintEl.textContent = '🎉 集结完成！';
    }
  }

  requestAnimationFrame(render);
}

// 开场爆炸
spawnExplosion(0, 0.3, VAL_RED, 25);
hintEl.textContent = '🎯 点击屏幕开始 →';
requestAnimationFrame(render);
</script>
</body>
</html>

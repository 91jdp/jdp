<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张青怡，你真的很漂亮</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  display: flex; justify-content: center; align-items: center;
  height: 100vh; overflow: hidden;
  font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
  user-select: none; -webkit-user-select: none;
}
canvas { display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ==================== 主程序 ====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 800;
canvas.width = W; canvas.height = H;

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
}
resize();
window.addEventListener('resize', resize);

// ==================== 状态 ====================
let phase = 'intro';
let frame = 0;
let phaseTransition = 0;
let particles = [];
let sparkles = [];
let fireflies = [];
let pulseRings = [];
let shootingStars = [];
let flowers = [];

// 坐标转换
function lx(x) { return (x + 2) / 4 * W; }
function ly(y) { return (2 - y) / 4 * H; }
function ls(s) { return s / 4 * W; }

// ==================== 星星 ====================
const stars = [];
for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random() * 4 - 2, y: Math.random() * 4 - 2,
    size: Math.random() * 3 + 0.3,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.04 + 0.01,
    hue: Math.random() < 0.3 ? 40 + Math.random() * 20 : 260 + Math.random() * 40
  });
}

// ==================== 花朵路径 ====================
function flowerPath(cx, cy, size, petals) {
  ctx.beginPath();
  for (let i = 0; i < petals; i++) {
    const angle = (i / petals) * Math.PI * 2;
    const r = ls(size);
    const px = lx(cx) + Math.cos(angle) * r;
    const py = ly(cy) + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(px, py);
    const cp1x = lx(cx) + Math.cos(angle - 0.3) * r * 1.6;
    const cp1y = ly(cy) + Math.sin(angle - 0.3) * r * 1.6;
    const cp2x = lx(cx) + Math.cos(angle + 0.3) * r * 1.6;
    const cp2y = ly(cy) + Math.sin(angle + 0.3) * r * 1.6;
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, px, py);
  }
  ctx.closePath();
}

// ==================== 特效函数 ====================
function spawnParticles(x, y, count, colors) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 0.08 + 0.02;
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 1, decay: Math.random() * 0.018 + 0.005,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: Math.random() * 10 + 3
    });
  }
}

function spawnShootingStar() {
  return {
    x: Math.random() * 1.5 - 0.5,
    y: Math.random() * 1.2 + 0.6,
    vx: Math.cos(-0.35) * (Math.random() * 0.06 + 0.04),
    vy: Math.sin(-0.35) * (Math.random() * 0.06 + 0.04),
    life: 1, decay: Math.random() * 0.02 + 0.012,
    length: Math.random() * 0.35 + 0.2
  };
}

// ==================== 鼠标交互 ====================
let mouseX = -999, mouseY = -999;

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  mouseX = ((e.clientX - rect.left) * scaleX) / W * 4 - 2;
  mouseY = 2 - ((e.clientY - rect.top) * scaleY) / H * 4;
  // 鼠标附近生成萤火虫
  if (Math.random() < 0.3) {
    fireflies.push({
      x: mouseX + (Math.random() - 0.5) * 0.4,
      y: mouseY + (Math.random() - 0.5) * 0.4,
      life: 1, decay: Math.random() * 0.012 + 0.006,
      size: Math.random() * 3 + 1
    });
  }
});

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  const cx = ((e.clientX - rect.left) * scaleX) / W * 4 - 2;
  const cy = 2 - ((e.clientY - rect.top) * scaleY) / H * 4;

  if (phase === 'intro') { phase = 'reveal'; frame = 0; phaseTransition = 0; }
  else if (phase === 'reveal') { phase = 'showcase'; frame = 0; phaseTransition = 0; }
  else if (phase === 'showcase') {
    spawnParticles(cx, cy, 30, ['#ff80ab','#ff4081','#ffab91','#fff176','#80d8ff','#b388ff','#ffffff']);
  }
});

// ==================== 触摸支持 ====================
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  mouseX = ((e.touches[0].clientX - rect.left) * scaleX) / W * 4 - 2;
  mouseY = 2 - ((e.touches[0].clientY - rect.top) * scaleY) / H * 4;
  if (Math.random() < 0.3) {
    fireflies.push({
      x: mouseX + (Math.random()-0.5)*0.4,
      y: mouseY + (Math.random()-0.5)*0.4,
      life: 1, decay: Math.random()*0.012+0.006,
      size: Math.random()*3+1
    });
  }
}, {passive: false});

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  const cx = ((e.changedTouches[0].clientX - rect.left) * scaleX) / W * 4 - 2;
  const cy = 2 - ((e.changedTouches[0].clientY - rect.top) * scaleY) / H * 4;
  if (phase === 'intro') { phase = 'reveal'; frame = 0; phaseTransition = 0; }
  else if (phase === 'reveal') { phase = 'showcase'; frame = 0; phaseTransition = 0; }
  else if (phase === 'showcase') {
    spawnParticles(cx, cy, 30, ['#ff80ab','#ff4081','#ffab91','#fff176','#80d8ff','#b388ff','#ffffff']);
  }
});

// ==================== 主渲染循环 ====================
function render() {
  frame++;
  if (phaseTransition < 1) phaseTransition = Math.min(1, phaseTransition + 0.035);

  // ---- 背景 ----
  const bgGrd = ctx.createRadialGradient(W/2, H/2, ls(0.1), W/2, H/2, ls(2.5));
  bgGrd.addColorStop(0, '#141030');
  bgGrd.addColorStop(0.5, '#0c0a20');
  bgGrd.addColorStop(1, '#050510');
  ctx.fillStyle = bgGrd;
  ctx.fillRect(0, 0, W, H);

  // ---- 极光效果 ----
  for (let i = 0; i < 3; i++) {
    const auroraGrd = ctx.createRadialGradient(
      W * (0.3 + i * 0.25), H * 0.5 + Math.sin(frame * 0.008 + i) * ls(0.4),
      0,
      W * (0.3 + i * 0.25), H * 0.5 + Math.sin(frame * 0.008 + i) * ls(0.4),
      ls(1.8)
    );
    const hues = [280, 320, 200];
    auroraGrd.addColorStop(0, `hsla(${hues[i]}, 80%, 60%, 0.06)`);
    auroraGrd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = auroraGrd;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- 星星 ----
  for (const s of stars) {
    const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(frame * s.speed + s.phase));
    const sx = lx(s.x), sy = ly(s.y);
    ctx.fillStyle = `hsla(${s.hue}, 80%, 70%, ${0.6 * twinkle})`;
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(0.3, ls(0.0035) * s.size * twinkle), 0, Math.PI*2);
    ctx.fill();
    if (s.size > 2.3) {
      const glowGrd = ctx.createRadialGradient(sx, sy, 0, sx, sy, ls(0.025));
      glowGrd.addColorStop(0, `hsla(${s.hue}, 80%, 80%, ${0.4*twinkle})`);
      glowGrd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glowGrd;
      ctx.beginPath(); ctx.arc(sx, sy, ls(0.025), 0, Math.PI*2); ctx.fill();
    }
  }

  // ---- 流星 ----
  if (Math.random() < 0.01 && shootingStars.length < 2) shootingStars.push(spawnShootingStar());
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const ss = shootingStars[i];
    ss.x += ss.vx; ss.y += ss.vy; ss.life -= ss.decay;
    if (ss.life <= 0 || Math.abs(ss.x) > 2.5 || Math.abs(ss.y) > 2.5) { shootingStars.splice(i,1); continue; }
    const ex = lx(ss.x), ey = ly(ss.y);
    const tx = lx(ss.x - ss.vx * ss.length * 10);
    const ty = ly(ss.y - ss.vy * ss.length * 10);
    const lineGrd = ctx.createLinearGradient(ex, ey, tx, ty);
    lineGrd.addColorStop(0, `rgba(255,255,255,${ss.life*0.8})`);
    lineGrd.addColorStop(1, 'rgba(200,200,255,0)');
    ctx.strokeStyle = lineGrd;
    ctx.lineWidth = ls(0.014);
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(tx, ty); ctx.stroke();
  }

  // ---- 萤火虫 ----
  for (let i = fireflies.length - 1; i >= 0; i--) {
    const ff = fireflies[i];
    ff.life -= ff.decay;
    if (ff.life <= 0) { fireflies.splice(i,1); continue; }
    const fx = lx(ff.x), fy = ly(ff.y);
    const ffGrd = ctx.createRadialGradient(fx, fy, 0, fx, fy, ls(0.04));
    ffGrd.addColorStop(0, `rgba(255,255,200,${ff.life*0.9})`);
    ffGrd.addColorStop(0.5, `rgba(255,200,100,${ff.life*0.3})`);
    ffGrd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ffGrd;
    ctx.beginPath(); ctx.arc(fx, fy, ls(0.04), 0, Math.PI*2); ctx.fill();
  }

  // ---- 脉冲环 ----
  if (frame % 15 === 0) pulseRings.push({r: 0.2, alpha: 1});
  for (let i = pulseRings.length - 1; i >= 0; i--) {
    pulseRings[i].r += 0.03;
    pulseRings[i].alpha -= 0.035;
    if (pulseRings[i].alpha <= 0) { pulseRings.splice(i,1); continue; }
    ctx.strokeStyle = `rgba(255,150,200,${pulseRings[i].alpha * 0.35})`;
    ctx.lineWidth = ls(0.012);
    ctx.beginPath(); ctx.arc(W/2, H/2, ls(pulseRings[i].r), 0, Math.PI*2); ctx.stroke();
  }

  // ---- 中央光晕 ----
  const centerGlow = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, ls(0.9));
  const centerPulse = 0.5 + 0.2 * Math.sin(frame * 0.02);
  centerGlow.addColorStop(0, `rgba(255,180,220,${centerPulse * 0.15})`);
  centerGlow.addColorStop(0.4, `rgba(200,150,255,${centerPulse * 0.06})`);
  centerGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = centerGlow;
  ctx.fillRect(0, 0, W, H);

  // ---- 装饰花朵 ----
  const flowerPositions = [
    {x: -1.0, y: -0.65}, {x: 1.0, y: -0.6}, {x: -0.7, y: 0.8}, {x: 0.75, y: 0.75},
    {x: -1.2, y: 0.1}, {x: 1.15, y: 0.05}
  ];
  const flowerColors = ['#ff80ab', '#ffab91', '#b388ff', '#80d8ff', '#ff8a80', '#f48fb1'];
  for (let fi = 0; fi < flowerPositions.length; fi++) {
    const fp = flowerPositions[fi];
    const fs = 0.12 + 0.03 * Math.sin(frame * 0.03 + fi);
    const fAlpha = 0.5 + 0.2 * Math.sin(frame * 0.04 + fi * 1.5);
    ctx.fillStyle = flowerColors[fi].replace(')', `, ${fAlpha})`).replace('#', 'rgba(');
    // 简单六瓣花
    for (let p = 0; p < 6; p++) {
      const angle = (p / 6) * Math.PI * 2 + frame * 0.008;
      const px = lx(fp.x) + Math.cos(angle) * ls(fs);
      const py = ly(fp.y) + Math.sin(angle) * ls(fs);
      ctx.beginPath();
      ctx.arc(px, py, ls(fs * 0.7), 0, Math.PI * 2);
      ctx.fill();
    }
    // 花蕊
    ctx.fillStyle = `rgba(255,255,200,${fAlpha + 0.1})`;
    ctx.beginPath();
    ctx.arc(lx(fp.x), ly(fp.y), ls(fs * 0.35), 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- 粒子系统 ----
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy -= 0.0006; p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i,1); continue; }
    if (p.color.startsWith('#')) {
      const r = parseInt(p.color.slice(1,3),16), g = parseInt(p.color.slice(3,5),16), b = parseInt(p.color.slice(5,7),16);
      ctx.fillStyle = `rgba(${r},${g},${b},${p.life})`;
    } else {
      ctx.fillStyle = p.color;
    }
    ctx.beginPath();
    ctx.arc(lx(p.x), ly(p.y), Math.max(0.3, ls(0.0055) * p.size * p.life), 0, Math.PI*2);
    ctx.fill();
  }

  const ta = phaseTransition;

  // ==================== 各阶段 ====================
  if (phase === 'intro') {
    // 初始提示
    const ha = (0.4 + 0.35 * Math.sin(frame * 0.06)) * ta;
    ctx.shadowColor = 'rgba(255,180,220,0.7)';
    ctx.shadowBlur = ls(0.07);
    ctx.fillStyle = `rgba(255,255,255,${ha})`;
    ctx.font = `bold ${ls(0.22)}px "Microsoft YaHei","PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('✨ 点击屏幕，有惊喜 ✨', W/2, ly(-1.4) + ls(0.11));
    ctx.shadowBlur = 0;

    // 微弱的预览文字
    ctx.fillStyle = `rgba(200,180,220,${ha*0.4})`;
    ctx.font = `${ls(0.13)}px "Microsoft YaHei","PingFang SC",sans-serif`;
    ctx.fillText('—— 致 张青怡 ——', W/2, ly(-1.0) + ls(0.06));
  }

  else if (phase === 'reveal') {
    // 逐行展示
    const lines = [
      '今天的你',
      '像清晨第一缕阳光',
      '温柔了整个世界',
      '张青怡，你真的很漂亮'
    ];
    const charsPerLine = [4, 8, 7, 10];
    let totalChars = 0;
    for (let i = 0; i < charsPerLine.length; i++) totalChars += charsPerLine[i];
    const shownTotal = Math.min(totalChars, Math.floor(frame / 2.5));
    let remaining = shownTotal;

    for (let i = 0; i < lines.length; i++) {
      const show = Math.min(charsPerLine[i], remaining);
      remaining -= show;
      if (show <= 0) break;
      const shown = lines[i].slice(0, show);
      const y = ly(-1.0 + i * 0.42) + ls(0.05 * i);

      ctx.textAlign = 'center';
      if (i === lines.length - 1) {
        ctx.shadowColor = 'rgba(255,150,200,0.6)';
        ctx.shadowBlur = ls(0.06);
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.font = `bold ${ls(0.26)}px "Microsoft YaHei","PingFang SC",sans-serif`;
      } else {
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,220,240,0.8)';
        ctx.font = `${ls(0.2)}px "Microsoft YaHei","PingFang SC",sans-serif`;
      }
      ctx.fillText(shown, W/2, y);
    }
    ctx.shadowBlur = 0;

    if (shownTotal >= totalChars) {
      const ha = 0.5 + 0.35 * Math.sin(frame * 0.05);
      ctx.fillStyle = `rgba(255,180,200,${ha})`;
      ctx.font = `${ls(0.13)}px "Microsoft YaHei","PingFang SC",sans-serif`;
      ctx.fillText('（点击继续...）', W/2, ly(-1.52));
    }
  }

  else if (phase === 'showcase') {
    // 主标题
    const mainText = '张青怡，你真的很美';
    const ty = ly(-1.15);

    // 多层发光效果
    for (let i = 5; i >= 0; i--) {
      const off = i === 0 ? 0 : Math.cos(i * 1.2) * ls(0.007) * (i % 3 + 1);
      const offY = i === 0 ? 0 : Math.sin(i * 1.2) * ls(0.007) * (i % 3 + 1);
      const alpha = i === 0 ? 0.93 : 0.15;
      const hue = i === 0 ? 340 : 280 + i * 30;
      ctx.fillStyle = `hsla(${hue}, 80%, ${i===0?95:70}%, ${alpha})`;
      ctx.font = i === 0
        ? `bold ${ls(0.34)}px "Microsoft YaHei","PingFang SC",sans-serif`
        : `${ls(0.34)}px "Microsoft YaHei","PingFang SC",sans-serif`;
      ctx.textAlign = 'center';
      if (i === 0) {
        ctx.shadowColor = 'rgba(255,130,180,0.7)';
        ctx.shadowBlur = ls(0.1);
      } else {
        ctx.shadowBlur = 0;
      }
      ctx.fillText(mainText, W/2 + off, ty + offY);
    }
    ctx.shadowBlur = 0;

    // 副标题
    const subAlpha = 0.7 + 0.2 * Math.sin(frame * 0.03);
    ctx.fillStyle = `rgba(255,210,230,${subAlpha})`;
    ctx.font = `${ls(0.17)}px "Microsoft YaHei","PingFang SC",sans-serif`;
    ctx.fillText('像银河里最耀眼的那颗星 ✨', W/2, ly(-0.65));

    // 持续装饰粒子
    if (frame % 4 === 0) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * 0.15 + 0.5;
      spawnParticles(
        Math.cos(angle) * r,
        Math.sin(angle) * r * 0.7,
        2,
        ['#ff80ab','#ffab91','#b388ff','#80d8ff','#ffffff','#ffd54f']
      );
    }

    // 底部提示
    const hintAlpha = 0.5 + 0.3 * Math.sin(frame * 0.04);
    ctx.fillStyle = `rgba(200,180,220,${hintAlpha})`;
    ctx.font = `${ls(0.12)}px "Microsoft YaHei","PingFang SC",sans-serif`;
    ctx.fillText('点击任意位置撒花 ✨', W/2, ly(-1.52));
  }

  requestAnimationFrame(render);
}

// 初始粒子爆发
spawnParticles(0, 0, 80, ['#ff80ab','#ffab91','#b388ff','#80d8ff','#ffffff','#ffd54f','#ff4081']);

requestAnimationFrame(render);
</script>
</body>
</html>
